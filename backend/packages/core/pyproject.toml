[project]
name = "nexagent-core"
version = "0.1.0"
description = "NexAgent core framework — agents, knowledge, skills, tools"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.2.0",
    "langchain-openai>=1.1.0",
    "langchain-community>=0.3.0",
    "langgraph>=1.0.6",
    "langgraph-checkpoint-sqlite>=3.0.0",
    "langchain-text-splitters>=0.3.0",
    "pydantic>=2.10.0",
    "pyyaml>=6.0.0",
    "httpx>=0.28.0",
    "tiktoken>=0.8.0",
    "aiofiles>=24.0.0",
    "python-dotenv>=1.0.0",
    # Database
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.30.0",
    "cryptography>=42.0",
    "minio>=7.2.0",
    "redis>=5.0.0",
    # Phase 5 — tools & MCP
    "ddgs>=9.0.0",
    "duckduckgo-search>=6.0.0",
    "langchain-mcp-adapters>=0.2.0",
    "tavily-python>=0.5.0",
]

[project.optional-dependencies]
# Knowledge Base — install with: pip install nexagent-core[knowledge]
# Requires: docker compose --profile kb up -d  (Milvus + Neo4j)
knowledge = [
    "pymilvus>=2.6,<2.7",
    "neo4j>=5.0.0",
    "lightrag-hku>=1.3.0",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "python-pptx>=1.0.0",
    "markdownify>=0.13.0",
]
advanced-parsing = [
    "docling>=2.68.0",
    "rapidocr-onnxruntime>=1.4.4",
    "opencv-python-headless>=4.11",
    "readability-lxml>=0.8.1",
]
rerank = [
    "sentence-transformers>=3.3.1",
]
# Anthropic model support
anthropic = ["langchain-anthropic>=1.3.0"]
# Google model support
google = ["langchain-google-genai>=4.0.0"]
# Local model support
ollama = ["langchain-ollama>=0.3.0"]
# All optional dependencies
all = [
    "nexagent-core[knowledge,advanced-parsing,rerank,anthropic,google,ollama]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nexagent"]
