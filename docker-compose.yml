# NexAgent — Docker Compose
#
# Development (recommended):
#   docker compose up -d
#   -> starts: gateway (hot-reload) + postgres + redis
#   -> access: http://localhost:8001  /  http://localhost:8001/docs
#
# Phase 3 (add knowledge base services):
#   docker compose --profile kb up -d
#   -> also starts: milvus + neo4j
#
# Production knowledge stack:
#   docker compose --profile prod up -d
#   -> starts: postgres + redis + minio + milvus + neo4j + gateway + worker + frontend
#
# Stop everything:
#   docker compose down

services:

  # ── Backend Gateway (FastAPI, hot-reload) ────────────────────────────────
  gateway:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: dev
    container_name: nexagent-gateway
    command: sh -c "pip install -e '/app/backend/packages/core[knowledge]' --quiet && cd /app/backend && python -m uvicorn app.gateway.app:app --host 0.0.0.0 --port 8001 --reload --reload-dir /app/backend"
    volumes:
      # Mount source code so edits on host are reflected instantly (hot-reload)
      - ./backend:/app/backend
      - ./config.yaml:/app/config.yaml:ro
      - ./skills:/app/skills
      - ${DOCKER_HOST_SOCK:-/var/run/docker.sock}:/var/run/docker.sock
      - ./.nexagent:/app/.nexagent
    ports:
      - "8001:8001"
    environment:
      - NEXAGENT_VERSION=0.1.0
      - NEXAGENT_CORS_ORIGINS=*
      - PYTHONPATH=/app/backend/packages/core:/app/backend
      - NEXAGENT_CONFIG_PATH=/app/config.yaml
      - NEXAGENT_DATA_DIR=/app/.nexagent
      - NEXAGENT_SANDBOX_HOST_ROOT=${PWD}/.nexagent
      - NEXAGENT_SANDBOX_CONTAINER_ROOT=/app/.nexagent
      - NEXAGENT_WIKI_LLM_TIMEOUT_S=${NEXAGENT_WIKI_LLM_TIMEOUT_S:-30}
      - DATABASE_URL=postgresql+asyncpg://nexagent:nexagent@postgres:5432/nexagent
      - REDIS_URL=redis://redis:6379/0
      - NEXAGENT_KB_STORAGE=${NEXAGENT_KB_STORAGE:-postgres}
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - MINIO_SECURE=false
      - MILVUS_HOST=milvus
      - MILVUS_PORT=19530
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=nexagent
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - nexagent
    restart: unless-stopped

  # ── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: nexagent-postgres
    environment:
      POSTGRES_USER: nexagent
      POSTGRES_PASSWORD: nexagent
      POSTGRES_DB: nexagent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexagent"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nexagent
    restart: unless-stopped

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: nexagent-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nexagent
    restart: unless-stopped

  # ── Milvus (Phase 3 — RAG knowledge base) ────────────────────────────────
  # Enable with: docker compose --profile kb up -d
  etcd:
    profiles: [kb, prod]
    image: quay.io/coreos/etcd:v3.5.5
    container_name: nexagent-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: >
      etcd -advertise-client-urls=http://etcd:2379
           -listen-client-urls=http://0.0.0.0:2379
           --data-dir /etcd
    volumes:
      - etcd_data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - nexagent

  minio:
    profiles: [kb, prod]
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: nexagent-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - nexagent

  milvus:
    profiles: [kb, prod]
    image: ${MILVUS_IMAGE:-milvusdb/milvus:v2.6.12}
    container_name: nexagent-milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - nexagent
    restart: unless-stopped

  # ── Neo4j (Phase 3 — knowledge graph) ────────────────────────────────────
  # Enable with: docker compose --profile kb up -d
  neo4j:
    profiles: [kb, prod]
    image: neo4j:5-community
    container_name: nexagent-neo4j
    environment:
      NEO4J_AUTH: neo4j/nexagent
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_heap_initial__size: 256m
      NEO4J_dbms_memory_heap_max__size: 512m
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - nexagent
    restart: unless-stopped

  worker:
    profiles: [prod]
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: dev
    container_name: nexagent-worker
    command: >
      sh -c "pip install -e '/app/backend/packages/core[knowledge]' --quiet &&
             python -m nexagent.knowledge.worker"
    volumes:
      - ./backend:/app/backend
      - ./config.yaml:/app/config.yaml:ro
      - nexagent_data:/app/.nexagent
    environment:
      - PYTHONPATH=/app/backend/packages/core:/app/backend
      - NEXAGENT_CONFIG_PATH=/app/config.yaml
      - NEXAGENT_DATA_DIR=/app/.nexagent
      - NEXAGENT_WIKI_LLM_TIMEOUT_S=${NEXAGENT_WIKI_LLM_TIMEOUT_S:-30}
      - DATABASE_URL=postgresql+asyncpg://nexagent:nexagent@postgres:5432/nexagent
      - REDIS_URL=redis://redis:6379/0
      - NEXAGENT_KB_STORAGE=postgres
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - MINIO_SECURE=false
      - MILVUS_HOST=milvus
      - MILVUS_PORT=19530
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=nexagent
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      milvus:
        condition: service_started
      neo4j:
        condition: service_healthy
    healthcheck:
      disable: true
    networks:
      - nexagent
    restart: unless-stopped

  frontend:
    profiles: [prod]
    image: node:22-alpine
    container_name: nexagent-frontend
    working_dir: /app/frontend
    command: sh -c "mkdir -p .next && rm -rf .next/* .next/.[!.]* .next/..?* && npm install --silent && npm run build && npm run start -- --hostname 0.0.0.0"
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
      - frontend_next:/app/frontend/.next
    ports:
      - "3000:3000"
    environment:
      - NEXT_TELEMETRY_DISABLED=1
      # Next.js rewrites /api/* to this target (server-side, inside the compose network).
      # Must use the gateway service name, not localhost (which is the frontend container itself).
      - NEXT_PUBLIC_API_URL=http://gateway:8001
      # Browser-side API base: the browser runs on the host, so it reaches the gateway
      # via the published port on localhost (CORS is enabled on the backend).
      - NEXT_PUBLIC_API_BASE=http://localhost:8001/api
    depends_on:
      gateway:
        condition: service_started
    networks:
      - nexagent
    restart: unless-stopped

  # Build-only sandbox image used by execute_python when NEXAGENT_SANDBOX_MODE=docker.
  sandbox-builder:
    profiles: [sandbox]
    build:
      context: ./docker/sandbox
    image: nexagent-sandbox:latest
    command: ["python", "-c", "print('nexagent sandbox image ready')"]
    networks:
      - nexagent

volumes:
  postgres_data:
  redis_data:
  etcd_data:
  minio_data:
  milvus_data:
  neo4j_data:
  nexagent_data:
  frontend_next:

networks:
  nexagent:
    driver: bridge
